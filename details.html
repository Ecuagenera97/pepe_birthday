<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b130d">
  <title>Detalles del Evento · Pepe Portilla 60 años</title>
  <meta name="description" content="Detalles del evento, ubicación y confirmación de asistencia.">
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="preload" as="image" href="img/03_portada.webp" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="pagina">

    <!-- 1. Portada -->
    <section class="hoja" aria-label="Invitación">
      <img src="img/03_portada.webp" width="1080" height="1920" fetchpriority="high"
           alt="Pepe Portilla. Usted está cordialmente invitado a celebrar 60 años.">
    </section>

    <!-- 2. Cuenta regresiva -->
    <section class="cuenta reveal" aria-label="Cuenta regresiva">
      <p class="titulo">Faltan</p>
      <p class="para" id="para" hidden>Invitación para <strong id="para-nombre"></strong></p>
      <div class="reloj" id="reloj" role="timer" aria-live="off">
        <div class="u"><span class="n" data-u="d">00</span><span class="l">Días</span></div>
        <div class="u"><span class="n" data-u="h">00</span><span class="l">Horas</span></div>
        <div class="u"><span class="n" data-u="m">00</span><span class="l">Min.</span></div>
        <div class="u"><span class="n" data-u="s">00</span><span class="l">Seg.</span></div>
      </div>
      <div class="calendario" id="calendario">
        <a class="btn-cal" id="cal-google" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Google Calendar</a>
        <button class="btn-cal" id="cal-ics" type="button">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>iPhone / Outlook</button>
      </div>
    </section>

    <!-- 3. Fecha y lugar -->
    <section class="hoja reveal" aria-label="Fecha y lugar">
      <img src="img/04_fecha_lugar.webp" width="1080" height="1920" loading="lazy" decoding="async"
           alt="Sábado 9 de enero, 4pm. El evento tendrá lugar en Uzhupud Garden, Paute - Ecuador.">
      <a class="zona" data-accion="mapa" target="_blank" rel="noopener" aria-label="Ver ubicación en el mapa"
         style="left:33.5%;top:74.5%;width:31.7%;height:3.3%"></a>
    </section>

    <!-- 4. Agenda -->
    <section class="hoja reveal" aria-label="Agenda de la noche">
      <img src="img/05_agenda.webp" width="1080" height="1920" loading="lazy" decoding="async"
           alt="Agenda de la noche: ceremonia en la Capilla San José 16h00, cóctel 17h00 a 18h45, cena de recepción 19h00 a 20h00, fiesta de celebración 20h30.">
    </section>

    <!-- 5. Código de vestimenta -->
    <section class="hoja reveal" aria-label="Código de vestimenta">
      <img src="img/06_vestimenta.webp" width="1080" height="1920" loading="lazy" decoding="async"
           alt="Código de vestimenta: traje formal. Verdes y sus tonalidades. Reservados para el cumpleañero.">
    </section>

    <!-- 6. Confirmación -->
    <section class="hoja reveal" aria-label="Confirmación de asistencia">
      <img src="img/07_confirmacion.webp" width="1080" height="1920" loading="lazy" decoding="async"
           alt="Agradecemos su confirmación hasta el 27 de diciembre del 2026.">
      <a class="zona" data-accion="confirmar" target="_blank" rel="noopener" aria-label="Confirmar asistencia por WhatsApp"
         style="left:9.5%;top:65%;width:43%;height:5%"></a>
    </section>

    <!-- 7. Hospedaje -->
    <section class="hoja reveal" aria-label="Hospedaje con tarifa especial">
      <img src="img/08_hospedaje.webp" width="1080" height="1920" loading="lazy" decoding="async"
           alt="Hospedaje, tarifa especial disponible para nuestros amigos. Hotel Uzhupud Garden.">
      <a class="zona" data-accion="hospedaje" target="_blank" rel="noopener" aria-label="Reservar hospedaje por WhatsApp"
         style="left:50.5%;top:61.2%;width:39%;height:4.6%"></a>
    </section>

    <!-- 8. Obsequio -->
    <section class="hoja reveal" aria-label="Obsequio">
      <img src="img/09_obsequio.webp" width="1080" height="1920" loading="lazy" decoding="async"
           alt="Obsequio. Su obsequio en sobre cerrado o transferencia será donado para la Fundación Santa María de la Esperanza. Te esperamos.">
      <a class="zona suave" data-accion="obsequio" target="_blank" rel="noopener" aria-label="Fundación Santa María de la Esperanza"
         style="left:34.4%;top:56.1%;width:31.3%;height:5.3%"></a>
    </section>

  </main>

  <button class="musica" id="musica" type="button" hidden aria-label="Reproducir música">
    <svg viewBox="0 0 24 24" id="musica-icono"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <audio id="audio" loop preload="none"></audio>

  <script src="config.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/details.js"></script>
</body>
</html>
