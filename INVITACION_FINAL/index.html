<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1610">
  <title>Pepe Portilla · 60 años – ¡Te esperamos!</title>

  <!-- Vista previa al compartir por WhatsApp (se escribe aquí a mano) -->
  <meta name="description" content="Detalles del evento, ubicación y confirmación de asistencia.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pepe Portilla · 60 años – ¡Te esperamos!">
  <meta property="og:description" content="Detalles del evento, ubicación y confirmación de asistencia.">
  <meta property="og:url" content="https://ecuagenera97.github.io/pepe_birthday/">
  <meta property="og:image" content="https://ecuagenera97.github.io/pepe_birthday/img/compartir.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="preload" as="image" href="img/p01_tapa.webp" fetchpriority="high">
  <link rel="preload" as="image" href="img/p02_cuero.webp">
  <link rel="preload" as="image" href="img/p02_logo_capa.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="escena" id="escena">
    <div class="libro" id="libro">

      <!-- ===================== HOJAS DEL LIBRO (se pasan como páginas) ===================== -->
      <div class="flip" id="flip">

        <!-- 2. Logo -->
        <section class="pagina logo" data-pag="logo" aria-label="Pepe Portilla, 60 años">
          <img class="base" src="img/p02_cuero.webp" alt="" width="1440" height="2560">
          <div class="logo-caja">
            <img class="logo-img" src="img/p02_logo_capa.webp" alt="60 Pepe Portilla">
            <span class="logo-brillo" aria-hidden="true"></span>
          </div>
          <div class="para" id="para" hidden>
            <span class="para-etq">Invitación para</span>
            <span class="para-nombre" id="para-nombre"></span>
          </div>
        </section>

        <!-- 3. Selva con animales -->
        <section class="pagina" data-pag="selva" aria-label="Usted está cordialmente invitado a celebrar 60 años">
          <img class="base" src="img/p03_selva.webp" alt="Pepe Portilla. Usted está cordialmente invitado a celebrar 60 años." width="1440" height="2560" decoding="async">
          <!-- VIDEO: si existe video/p03.mp4 se reproduce aquí (ver js/vivo.js) -->
        </section>

        <!-- 4. Cuenta regresiva -->
        <section class="pagina" data-pag="cuenta" aria-label="Cuenta regresiva">
          <img class="base" src="img/p04_cuenta.webp" alt="Faltan" width="1440" height="2560" decoding="async">
          <!-- Agujas del reloj (giran y marcan la hora de Ecuador) -->
          <svg class="agujas" id="agujas" viewBox="-200 -200 400 400" aria-hidden="true">
            <defs>
              <linearGradient id="oroAguja" x1="0" x2="1"><stop offset="0" stop-color="#3a2614"/><stop offset=".5" stop-color="#1f140b"/><stop offset="1" stop-color="#3a2614"/></linearGradient>
            </defs>
            <g id="ag-hora">
              <path d="M-5 22 L-3.2 -40 C-12 -48 -12 -62 0 -66 C12 -62 12 -48 3.2 -40 L5 22 Z M0 -60 a6 6 0 1 0 .01 0 Z" fill="url(#oroAguja)" fill-rule="evenodd"/>
              <path d="M0 -66 L-7 -84 L0 -108 L7 -84 Z" fill="url(#oroAguja)"/>
            </g>
            <g id="ag-min">
              <path d="M-3.6 28 L-2 -96 C-9 -104 -9 -116 0 -120 C9 -116 9 -104 2 -96 L3.6 28 Z M0 -114 a4.5 4.5 0 1 0 .01 0 Z" fill="url(#oroAguja)" fill-rule="evenodd"/>
              <path d="M0 -120 L-5 -134 L0 -158 L5 -134 Z" fill="url(#oroAguja)"/>
            </g>
            <g id="ag-seg">
              <path d="M-1 34 L-.7 -150 L0 -162 L.7 -150 L1 34 Z" fill="#9a6a2a"/>
              <circle cy="22" r="6" fill="none" stroke="#9a6a2a" stroke-width="2"/>
            </g>
            <circle r="11" fill="#2a1b0e"/><circle r="7" fill="#b8893f"/><circle r="3" fill="#5a3b18"/>
          </svg>
          <div class="reloj" id="reloj" role="timer" aria-live="off">
            <div class="u"><span class="n" data-u="d">00</span><span class="l">Días</span></div>
            <div class="u"><span class="n" data-u="h">00</span><span class="l">Horas</span></div>
            <div class="u"><span class="n" data-u="m">00</span><span class="l">Min</span></div>
            <div class="u"><span class="n" data-u="s">00</span><span class="l">Seg</span></div>
          </div>
          <span class="late" style="--l:28;--t:63.6;--w:44;--h:5" data-img="p04_cuenta"></span>
          <span class="late" style="--l:28;--t:71.2;--w:44;--h:5" data-img="p04_cuenta"></span>
          <a class="zona" id="cal-google" target="_blank" rel="noopener" aria-label="Agregar a Google Calendar" style="left:28%;top:63.6%;width:44%;height:5%"></a>
          <a class="zona" id="cal-ics" href="#" aria-label="Agregar al calendario de iPhone u Outlook" style="left:28%;top:71.2%;width:44%;height:5%"></a>
        </section>

        <!-- 5. Fecha y lugar -->
        <section class="pagina" data-pag="fecha" aria-label="Fecha y lugar">
          <img class="base" src="img/p05_fecha.webp" alt="Sábado 9 de enero, 4pm. El evento tendrá lugar en Uzhupud Garden, Paute - Ecuador." width="1440" height="2560" decoding="async">
          <span class="late" style="--l:31.5;--t:74.3;--w:37;--h:4.2" data-img="p05_fecha"></span>
          <a class="zona" data-accion="mapa" target="_blank" rel="noopener" aria-label="Ver ubicación en el mapa" style="left:31.5%;top:74.3%;width:37%;height:4.2%"></a>
          <a class="zona suave" data-accion="mapa" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true" style="left:18%;top:51%;width:64%;height:19%"></a>
        </section>

        <!-- 6. Agenda -->
        <section class="pagina" data-pag="agenda" aria-label="Agenda de la noche">
          <img class="base" src="img/p06_agenda.webp" alt="Agenda de la noche: ceremonia en la Capilla San José 16h00, cóctel de bienvenida en el Museo 17h00, cena de recepción 20h00, fiesta de celebración 20h30." width="1440" height="2560" decoding="async">
          <img class="estrella" src="img/p06_estrella.png" alt="" aria-hidden="true">
        </section>

        <!-- 7. Vestimenta -->
        <section class="pagina" data-pag="vestimenta" aria-label="Código de vestimenta">
          <img class="base" src="img/p07_vestimenta.webp" alt="Código de vestimenta: traje formal. Verdes y sus tonalidades, reservados para el cumpleañero." width="1440" height="2560" decoding="async">
        </section>

        <!-- 8. Confirmación -->
        <section class="pagina" data-pag="confirmacion" aria-label="Confirmación de asistencia">
          <img class="base" src="img/p08_confirmacion.webp" alt="Agradecemos su confirmación hasta el 27 de diciembre del 2026." width="1440" height="2560" decoding="async">
          <span class="late" style="--l:9.4;--t:64.8;--w:42;--h:5.4" data-img="p08_confirmacion"></span>
          <a class="zona" data-accion="confirmar" target="_blank" rel="noopener" aria-label="Confirmar asistencia por WhatsApp" style="left:9.4%;top:64.8%;width:42%;height:5.4%"></a>
        </section>

        <!-- 9. Hospedaje -->
        <section class="pagina" data-pag="hospedaje" aria-label="Hospedaje con tarifa especial">
          <img class="base" src="img/p09_hospedaje.webp" alt="Hospedaje. Tarifa especial disponible para nuestros amigos en Uzhupud Garden." width="1440" height="2560" decoding="async">
          <span class="late" style="--l:50.5;--t:56.8;--w:38.5;--h:4.8" data-img="p09_hospedaje"></span>
          <a class="zona" data-accion="hospedaje" target="_blank" rel="noopener" aria-label="Reservar hospedaje por WhatsApp" style="left:50.5%;top:56.8%;width:38.5%;height:4.8%"></a>
        </section>

        <!-- 10. Obsequio -->
        <section class="pagina" data-pag="obsequio" aria-label="Obsequio">
          <img class="base" src="img/p10_obsequio.webp" alt="Obsequio. Su obsequio en sobre cerrado o transferencia será donado para la Fundación Santa María de la Esperanza." width="1440" height="2560" decoding="async">
          <span class="late suave" style="--l:33.5;--t:56.2;--w:33;--h:4.8" data-img="p10_obsequio"></span>
          <a class="zona suave" data-accion="obsequio" target="_blank" rel="noopener" aria-label="Fundación Santa María de la Esperanza" style="left:33.5%;top:56.2%;width:33%;height:4.8%"></a>
        </section>

        <!-- 11. Te esperamos -->
        <section class="pagina" data-pag="esperamos" aria-label="Te esperamos">
          <img class="base" src="img/p11_esperamos.webp" alt="Te esperamos. Para brindar por la vida y compartir una noche inolvidable." width="1440" height="2560" decoding="async">
        </section>
      </div>

      <!-- ===================== 1. TAPA (se abre de derecha a izquierda) ===================== -->
      <div class="tapa" id="tapa">
        <div class="tapa-cara frente">
          <img src="img/p01_tapa.webp" alt="Libro cerrado con el sello de Pepe Portilla" width="1440" height="2560" fetchpriority="high">
          <button class="zona redonda sello" id="sello" type="button" aria-label="Abrir la invitación"></button>
        </div>
        <div class="tapa-cara dorso" aria-hidden="true"></div>
      </div>
    </div>

    <!-- Puntos de página y flechas (aparecen al abrir el libro) -->
    <nav class="mando" id="mando" aria-label="Páginas" hidden>
      <button class="pista atras" id="atras" type="button" aria-label="Página anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="puntos" id="puntos"></div>
      <button class="pista" id="siguiente" type="button" aria-label="Página siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </nav>
  </main>

  <button class="musica" id="musica" type="button" hidden aria-label="Reproducir música">
    <svg viewBox="0 0 24 24" id="musica-icono"><path d="M4 9v6h4l5 4V5L8 9z"/></svg>
  </button>
  <audio id="audio" loop preload="none"></audio>

  <script src="config.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/page-flip.js"></script>
  <script src="js/vivo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
